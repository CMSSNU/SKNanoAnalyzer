# Correction configuration for era 2024.
#
# Read by MyCorrection::GetEraConfig at construction. Adding an era means
# dropping an era_config.yml into $SKNANO_DATA/<era>/Correction/ -- no C++
# change and no rebuild.
#
# Path resolution:
#   pog_files   -> $JSONPOG_REPO_PATH/<pog>/<campaign>/<snapshot>/<name>
#   data_files  -> $SKNANO_DATA/<era>/<path>
#   roccor      -> $ROCCOR_PATH/<name>
#
# A correction that is simply absent from pog_files/data_files is skipped at
# load time. Use that instead of pointing at a file that does not exist.

campaign: Run3-24CDEReprocessingFGHIPrompt-Summer24-NanoAODv15

# Snapshot (the dated directory under the campaign) to read each POG from.
# Every POG is published on its own cadence, so there is no single date that
# exists everywhere -- pin them one by one.
#
# "latest" tracks whatever the corrections area was last synced to, so a rerun
# months apart can silently pick up different scale factors. Anything left on
# "latest" is reported at startup.
#
# Resolution order, first match wins:
#   $SKNANO_CORRECTION_TAG  (env, forces every POG -- for one-off comparisons)
#   pog_files.<entry>.snapshot
#   snapshots.<POG>
#   snapshots.default
#
# Non-dated variant branches (EGM/heep-id, JME/newJERFormats,
# MUO/muon_2024_low_pt_SF) are valid values here too.
snapshots:
  default: latest
  MUO: latest
  LUM: latest
  BTV: latest
  EGM: latest
  JME: latest
  TAU: latest

# Printed in red at startup. Use for known-wrong inputs we are living with.
warnings:
  - "ONNX models for TopPt reweight are 13TeV, not 13.6TeV. Update when available."
  - "No 2024 entry in any of the three hard-coded high-pT muon maps (Generalized Endpoint kappa, smearing strength, resolution polynomial). Every high-pT momentum lane (HighPtPt, HighPtScaleUp/Down, HighPtResUp/Down) equals TuneP, so the GE and resolution nuisances are identically zero, and GetMuonHighPtResolution returns 0 for every muon. The high-pT ID/RECO/HLT scale factors from muon_HighPt.json.gz are unaffected."

# Era-dependent keys inside the correctionlib files.
keys:
  LUM: Collisions24_BCDEFGHI_goldenJSON
  EGM: "2024Prompt"
  JME_vetomap: Summer24Prompt24_RunBCDEFGHI_V1

# JERC global tags. "######" is substituted with the correction level
# (PtResolution, ScaleFactor, SFUncertainty, L1FastJet, L2Relative, ...).
# JER has no separate DATA tag for this era: data uses the MC campaign.
global_tags:
  JER:      "Summer24Prompt24_JRV2_MC_######_AK4PFPuppi"
  JES_MC:   "Summer24Prompt24_V5_MC_######_AK4PFPuppi"
  JES_DATA: "Summer24Prompt24_V5_DATA_######_AK4PFPuppi"
  # AK8 counterparts, read from fatJet_jerc.json.gz. FJER has no DATA form for
  # the same reason JER does not: resolution is only measured in simulation.
  FJER:      "Summer24Prompt24_JRV2_MC_######_AK8PFPuppi"
  FJES_MC:   "Summer24Prompt24_V5_MC_######_AK8PFPuppi"
  FJES_DATA: "Summer24Prompt24_V5_DATA_######_AK8PFPuppi"

# Central POG corrections. required: true aborts the job if the file is
# missing; everything else only warns. Add "snapshot: <dir>" to an entry to
# read that one file from a different snapshot than the rest of its POG.
pog_files:
  jetid:              {pog: JME, name: jetid.json.gz,       required: true}
  jerc:               {pog: JME, name: jet_jerc.json.gz,    required: true}
  jetvetomap:         {pog: JME, name: jetvetomaps.json.gz, required: true}
  muon:               {pog: MUO, name: muon_Z.json.gz}
  # MUO POG medium-pT momentum scale (data+MC) and resolution smearing (MC),
  # the Run 3 replacement for Rochester. When present it takes precedence
  # over "roccor" below. The _VXBS variant of the file is for the
  # vertex+beamspot constrained pt, not for Muon_pt, so it is not used.
  muon_scalesmearing: {pog: MUO, name: muon_scalesmearing.json.gz, required: true}
  # High-pT muon ID/Iso/RECO/HLT scale factors, for the TuneP selection path.
  muon_highpt:        {pog: MUO, name: muon_HighPt.json.gz}
  tau:                {pog: TAU, name: tau.json.gz}
  # No dedicated 2024 muon trigger SF yet; reuse the muon_Z file.
  muon_trig_sf:       {pog: MUO, name: muon_Z.json.gz}
  puWeights:          {pog: LUM, name: puWeights_BCDEFGHI.json.gz}
  btagging:           {pog: BTV, name: btagging.json.gz}
  electron:           {pog: EGM, name: electron.json.gz}
  # HEEP (high-pT) electron ID SF. EGM publishes the HEEPID working point on
  # the non-dated "heep-id" branch of the campaign rather than in the dated
  # snapshots; the file has the same Electron-ID-SF layout as the one above.
  electron_heep:      {pog: EGM, name: electron.json.gz, snapshot: heep-id}
  electron_variation: {pog: EGM, name: electronSS_EtDependent.json.gz, required: true}
  electron_hlt:       {pog: EGM, name: electronHlt.json.gz}
  # Not published for 2024 yet -- restore when they appear:
  #   ctagging:   {pog: BTV, name: ctagging.json.gz}
  #   met:        {pog: JME, name: met.json.gz}
  # AK8 JERC, read through the FJER/FJES global_tags above.
  jerc_fatjet:        {pog: JME, name: fatJet_jerc.json.gz}

# Home-made inputs under $SKNANO_DATA/2024/.
data_files:
  muon_trig_eff:       MUO/muon_trig.json
  golden_json:         LUM/Cert_Collisions2024_378981_386951_Golden.json
  onnx_toppt_reweight: ONNX/mymodel12_13TeV_MiNNLO_afterShower.onnx
  onnx_hDampUp:        ONNX/mymodel12_hdamp_up_13.6TeV.onnx
  onnx_hDampDown:      ONNX/mymodel12_hdamp_down_13.6TeV.onnx
  onnx_rBnom:          ONNX/mymodel12_rB_nom_CP5_2M.onnx
  onnx_rBUp:           ONNX/mymodel12_rB_up_CP5_2M.onnx
  # Regenerated 2026-09-01 by data/*/MakeTaggingEffJson.py from pre-b-tag
  # private NanoAOD jets. Needed by the fixed-WP method-1a b-tag weight: BTV
  # publishes no shape correction for 2024.
  btagging_eff:        BTV/btaggingEff.json
  # Generated by data/*/MakeTaggingRJson.py -- regenerate before enabling:
  #   ctagging_R:   BTV/ctaggingR.json

# Rochester: superseded by muon_scalesmearing above for this era. There is no
# 2024 RoccoR release; leaving this out (rather than borrowing 2023BPix) means
# the POG file is the only medium-pT correction in play.
# roccor: RoccoR2023BPix.txt
